<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roomify - Cari Hotel & Tempat Menginap</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800">

    <!-- NAVBAR -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo -->
                <div class="flex items-center gap-2 cursor-pointer" onclick="resetFilter()">
                    <div class="bg-indigo-600 text-white p-2 rounded-xl">
                        <i class="fa-solid me-0 fa-hotel text-xl"></i>
                    </div>
                    <span class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">Roomify</span>
                </div>
                <!-- Right Action -->
                <div class="flex items-center gap-4">
                    <button class="relative p-2 text-slate-600 hover:text-indigo-600 transition">
                        <i class="fa-regular fa-heart text-xl"></i>
                        <span id="favCount" class="absolute -top-1 -right-1 bg-rose-500 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center font-bold">0</span>
                    </button>
                    <button class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-sm font-semibold transition shadow-md shadow-indigo-100">
                        Masuk
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- HERO SECTION & SEARCH BAR -->
    <section class="bg-gradient-to-b from-indigo-900 to-indigo-800 text-white py-12 px-4">
        <div class="max-w-5xl mx-auto text-center">
            <h1 class="text-3xl sm:text-5xl font-extrabold mb-4 leading-tight">Temukan Hotel Terbaik untuk Liburan Anda</h1>
            <p class="text-indigo-200 text-base sm:text-lg mb-8">Pesan kamar hotel impian di berbagai kota dengan harga terbaik.</p>

            <!-- Search Form Card -->
            <div class="bg-white rounded-2xl p-4 sm:p-6 text-slate-800 shadow-xl max-w-4xl mx-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <!-- Location Input -->
                    <div class="text-left">
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Lokasi / Nama Hotel</label>
                        <div class="flex items-center border border-slate-200 rounded-xl px-3 py-2">
                            <i class="fa-solid fa-location-dot text-indigo-600 mr-2"></i>
                            <input type="text" id="searchInput" placeholder="Cari Medan, Bali, Jakarta..." class="w-full text-sm outline-none bg-transparent">
                        </div>
                    </div>
                    <!-- Date Input -->
                    <div class="text-left">
                        <label class="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Tanggal Check-in</label>
                        <div class="flex items-center border border-slate-200 rounded-xl px-3 py-2">
                            <i class="fa-regular fa-calendar text-indigo-600 mr-2"></i>
                            <input type="date" id="dateInput" class="w-full text-sm outline-none bg-transparent text-slate-600">
                        </div>
                    </div>
                    <!-- Submit Button -->
                    <div class="flex items-end">
                        <button onclick="applyFilters()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-semibold text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-indigo-200">
                            <i class="fa-solid fa-magnifying-glass"></i> Cari Hotel
                        </button>
                    </div>
                </div>

                <!-- Quick Location Tags -->
                <div class="flex flex-wrap items-center gap-2 mt-4 pt-4 border-t border-slate-100 text-xs">
                    <span class="text-slate-400 font-medium">Kota Populer:</span>
                    <button onclick="filterByCity('Medan')" class="px-3 py-1 bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 rounded-full font-medium transition">Medan</button>
                    <button onclick="filterByCity('Bali')" class="px-3 py-1 bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 rounded-full font-medium transition">Bali</button>
                    <button onclick="filterByCity('Jakarta')" class="px-3 py-1 bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 rounded-full font-medium transition">Jakarta</button>
                    <button onclick="filterByCity('Yogyakarta')" class="px-3 py-1 bg-slate-100 hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 rounded-full font-medium transition">Yogyakarta</button>
                </div>
            </div>
        </div>
    </section>

    <!-- MAIN CONTENT (FILTER + HOTEL LIST) -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-8">
            
            <!-- SIDEBAR FILTER -->
            <aside class="lg:col-span-1 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-fit">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-slate-800 text-lg">Filter Pencarian</h3>
                    <button onclick="resetFilter()" class="text-xs text-indigo-600 hover:underline font-semibold">Reset</button>
                </div>

                <!-- Filter Harga -->
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Harga Maksimum / Malam</label>
                    <input type="range" id="priceRange" min="300000" max="3000000" step="100000" value="3000000" class="w-full accent-indigo-600" oninput="updatePriceLabel(this.value)">
                    <div class="flex justify-between text-xs text-slate-500 font-medium mt-1">
                        <span>Rp 300rb</span>
                        <span id="priceLabel" class="font-bold text-indigo-600">Rp 3.000.000</span>
                    </div>
                </div>

                <!-- Filter Rating -->
                <div class="mb-6">
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Rating Minimal</label>
                    <div class="space-y-2">
                        <label class="flex items-center text-sm text-slate-600 gap-2 cursor-pointer">
                            <input type="radio" name="ratingFilter" value="0" checked onchange="applyFilters()" class="accent-indigo-600"> Semua Rating
                        </label>
                        <label class="flex items-center text-sm text-slate-600 gap-2 cursor-pointer">
                            <input type="radio" name="ratingFilter" value="4.5" onchange="applyFilters()" class="accent-indigo-600">
                            <span class="text-amber-500"><i class="fa-solid fa-star"></i> 4.5+</span> (Luar Biasa)
                        </label>
                        <label class="flex items-center text-sm text-slate-600 gap-2 cursor-pointer">
                            <input type="radio" name="ratingFilter" value="4.0" onchange="applyFilters()" class="accent-indigo-600">
                            <span class="text-amber-500"><i class="fa-solid fa-star"></i> 4.0+</span> (Sangat Baik)
                        </label>
                    </div>
                </div>

                <!-- Filter Fasilitas -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Fasilitas</label>
                    <div class="space-y-2 text-sm text-slate-600">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" value="WiFi" class="facility-checkbox accent-indigo-600" onchange="applyFilters()"> Free WiFi
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" value="Kolam Renang" class="facility-checkbox accent-indigo-600" onchange="applyFilters()"> Kolam Renang
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" value="Sarapan" class="facility-checkbox accent-indigo-600" onchange="applyFilters()"> Gratis Sarapan
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="checkbox" value="Gym" class="facility-checkbox accent-indigo-600" onchange="applyFilters()"> Fitness Center
                        </label>
                    </div>
                </div>
            </aside>

            <!-- HOTEL LIST CONTAINER -->
            <section class="lg:col-span-3">
                <div class="flex justify-between items-center mb-6">
                    <p class="text-slate-500 text-sm">Menampilkan <span id="hotelCount" class="font-bold text-slate-800">0</span> hotel yang tersedia</p>
                </div>

                <!-- Hotel Cards Grid -->
                <div id="hotelGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Hotel cards injected by JavaScript -->
                </div>
            </section>

        </div>
    </main>

    <!-- MODAL DETAIL HOTEL -->
    <div id="hotelModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl animate-fade-in">
            <div class="relative h-64">
                <img id="modalImg" src="" alt="Hotel Detail" class="w-full h-full object-cover">
                <button onclick="closeModal()" class="absolute top-4 right-4 bg-white/80 hover:bg-white text-slate-700 w-9 h-9 rounded-full flex items-center justify-center transition">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="p-6">
                <div class="flex justify-between items-start mb-2">
                    <div>
                        <span id="modalCity" class="text-xs font-semibold text-indigo-600 uppercase tracking-wide"></span>
                        <h2 id="modalTitle" class="text-2xl font-bold text-slate-800"></h2>
                    </div>
                    <div id="modalRating" class="flex items-center bg-amber-50 text-amber-700 px-3 py-1 rounded-lg text-sm font-bold border border-amber-200"></div>
                </div>
                <p id="modalAddress" class="text-sm text-slate-500 mb-4 flex items-center gap-1">
                    <i class="fa-solid fa-location-dot text-rose-500"></i> <span></span>
                </p>

                <h4 class="font-semibold text-slate-800 text-sm mb-2">Fasilitas Utama:</h4>
                <div id="modalFacilities" class="flex flex-wrap gap-2 mb-6"></div>

                <div class="flex items-center justify-between pt-4 border-t border-slate-100">
                    <div>
                        <span class="text-xs text-slate-400 block">Harga per malam</span>
                        <span id="modalPrice" class="text-2xl font-extrabold text-indigo-600"></span>
                    </div>
                    <button onclick="confirmBooking()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-bold transition shadow-md shadow-indigo-100">
                        Pesan Sekarang
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT LOGIC -->
    <script>
        // Data Mockup Hotel Roomify
        const hotelsData = [
            {
                id: 1,
                name: "JW Marriott Hotel Medan",
                city: "Medan",
                address: "Jl. Putri Hijau No.10, Kesawan, Medan",
                price: 1450000,
                rating: 4.8,
                reviews: 1240,
                facilities: ["WiFi", "Kolam Renang", "Sarapan", "Gym"],
                image: "https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80"
            },
            {
                id: 2,
                name: "Grand Aston City Hall",
                city: "Medan",
                address: "Jl. Balai Kota No.1, Medan",
                price: 950000,
                rating: 4.6,
                reviews: 890,
                facilities: ["WiFi", "Kolam Renang", "Sarapan"],
                image: "https://images.unsplash.com/photo-1582719508461-905c673771fd?auto=format&fit=crop&w=800&q=80"
            },
            {
                id: 3,
                name: "The Mulia Resort Bali",
                city: "Bali",
                address: "Kawasan Sawangan, Jl. Raya Nusa Dua",
                price: 2800000,
                rating: 4.9,
                reviews: 2150,
                facilities: ["WiFi", "Kolam Renang", "Sarapan", "Gym"],
                image: "https://images.unsplash.com/photo-1571896349842-33c89424de2d?auto=format&fit=crop&w=800&q=80"
            },
            {
                id: 4,
                name: "Hotel Indonesia Kempinski",
                city: "Jakarta",
                address: "Jl. M.H. Thamrin No.1, Jakarta Pusat",
                price: 2400000,
                rating: 4.7,
                reviews: 1540,
                facilities: ["WiFi", "Kolam Renang", "Gym"],
                image: "https://images.unsplash.com/photo-1542314831-068cd1dbfeeb?auto=format&fit=crop&w=800&q=80"
            },
            {
                id: 5,
                name: "Eastparc Hotel Yogyakarta",
                city: "Yogyakarta",
                address: "Jl. Laksda Adisucipto Km 6.5, Yogyakarta",
                price: 850000,
                rating: 4.5,
                reviews: 670,
                facilities: ["WiFi", "Kolam Renang", "Sarapan"],
                image: "https://images.unsplash.com/photo-1520250497591-112f2f40a3f4?auto=format&fit=crop&w=800&q=80"
            },
            {
                id: 6,
                name: "Aryaduta Medan",
                city: "Medan",
                address: "Jl. Pekapuran No.2, Medan",
                price: 680000,
                rating: 4.3,
                reviews: 430,
                facilities: ["WiFi", "Sarapan"],
                image: "https://images.unsplash.com/photo-1590490360182-c33d57733427?auto=format&fit=crop&w=800&q=80"
            }
        ];

        let favorites = [];

        // Format Currency ke Rupiah
        const formatRupiah = (number) => {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(number);
        };

        // Render Cards Hotel
        function renderHotels(data) {
            const grid = document.getElementById('hotelGrid');
            document.getElementById('hotelCount').innerText = data.length;

            if (data.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-slate-200">
                        <i class="fa-solid fa-hotel-slash text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500 font-semibold">Tidak ada hotel yang sesuai dengan kriteria pencarian Anda.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = data.map(hotel => {
                const isFav = favorites.includes(hotel.id);
                return `
                <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden hover:shadow-lg transition group flex flex-col justify-between">
                    <div>
                        <div class="relative h-48 overflow-hidden">
                            <img src="${hotel.image}" alt="${hotel.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                            <button onclick="toggleFavorite(${hotel.id})" class="absolute top-3 right-3 bg-white/80 backdrop-blur-sm p-2 rounded-full text-slate-700 hover:text-rose-500 transition">
                                <i class="${isFav ? 'fa-solid text-rose-500' : 'fa-regular'} fa-heart"></i>
                            </button>
                            <span class="absolute bottom-3 left-3 bg-slate-900/70 text-white text-xs px-2.5 py-1 rounded-md backdrop-blur-sm font-medium">
                                ${hotel.city}
                            </span>
                        </div>
                        <div class="p-5">
                            <div class="flex justify-between items-center mb-1">
                                <h3 class="font-bold text-slate-800 text-lg group-hover:text-indigo-600 transition truncate">${hotel.name}</h3>
                            </div>
                            <p class="text-xs text-slate-400 mb-3 flex items-center gap-1">
                                <i class="fa-solid fa-location-dot text-indigo-500"></i> ${hotel.address}
                            </p>
                            <div class="flex items-center gap-1 text-xs text-amber-500 font-bold mb-4">
                                <i class="fa-solid fa-star"></i>
                                <span>${hotel.rating}</span>
                                <span class="text-slate-400 font-normal">(${hotel.reviews} ulasan)</span>
                            </div>
                            <div class="flex flex-wrap gap-1.5">
                                ${hotel.facilities.map(f => `<span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-md font-medium">${f}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                    <div class="p-5 pt-0 flex justify-between items-end border-t border-slate-50 mt-4">
                        <div>
                            <span class="text-[10px] text-slate-400 block">Mulai dari</span>
                            <span class="text-lg font-extrabold text-indigo-600">${formatRupiah(hotel.price)}</span>
                        </div>
                        <button onclick="openModal(${hotel.id})" class="bg-indigo-50 hover:bg-indigo-600 text-indigo-600 hover:text-white text-xs font-bold px-4 py-2.5 rounded-xl transition">
                            Lihat Detail
                        </button>
                    </div>
                </div>
            `}).join('');
        }

        // Filter Logic
        function applyFilters() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const maxPrice = parseInt(document.getElementById('priceRange').value);
            const minRating = parseFloat(document.querySelector('input[name="ratingFilter"]:checked').value);
            const selectedFacilities = Array.from(document.querySelectorAll('.facility-checkbox:checked')).map(cb => cb.value);

            const filtered = hotelsData.filter(h => {
                const matchSearch = h.name.toLowerCase().includes(searchVal) || h.city.toLowerCase().includes(searchVal);
                const matchPrice = h.price <= maxPrice;
                const matchRating = h.rating >= minRating;
                const matchFacility = selectedFacilities.every(f => h.facilities.includes(f));

                return matchSearch && matchPrice && matchRating && matchFacility;
            });

            renderHotels(filtered);
        }

        function filterByCity(cityName) {
            document.getElementById('searchInput').value = cityName;
            applyFilters();
        }

        function updatePriceLabel(val) {
            document.getElementById('priceLabel').innerText = formatRupiah(val);
            applyFilters();
        }

        function resetFilter() {
            document.getElementById('searchInput').value = '';
            document.getElementById('priceRange').value = 3000000;
            document.getElementById('priceLabel').innerText = formatRupiah(3000000);
            document.querySelectorAll('.facility-checkbox').forEach(cb => cb.checked = false);
            document.querySelector('input[name="ratingFilter"][value="0"]').checked = true;
            renderHotels(hotelsData);
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            document.getElementById('favCount').innerText = favorites.length;
            applyFilters();
        }

        // Modal Logic
        function openModal(id) {
            const hotel = hotelsData.find(h => h.id === id);
            if (!hotel) return;

            document.getElementById('modalImg').src = hotel.image;
            document.getElementById('modalCity').innerText = hotel.city;
            document.getElementById('modalTitle').innerText = hotel.name;
            document.getElementById('modalAddress').querySelector('span').innerText = hotel.address;
            document.getElementById('modalRating').innerHTML = `<i class="fa-solid fa-star mr-1"></i> ${hotel.rating} / 5.0`;
            document.getElementById('modalPrice').innerText = formatRupiah(hotel.price);

            document.getElementById('modalFacilities').innerHTML = hotel.facilities.map(f => `
                <span class="bg-indigo-50 text-indigo-700 text-xs px-3 py-1.5 rounded-lg font-semibold flex items-center gap-1.5">
                    <i class="fa-solid fa-check text-indigo-500"></i> ${f}
                </span>
            `).join('');

            const modal = document.getElementById('hotelModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('hotelModal');
            modal.classList.remove('flex');
            modal.classList.add('hidden');
        }

        function confirmBooking() {
            alert('Terima kasih! Pemesanan hotel Anda berhasil diproses.');
            closeModal();
        }

        // Init First Render
        renderHotels(hotelsData);
    </script>
</body>
</html>
